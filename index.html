<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>★★★ ZUTRITT ★★★</title>
    <style>
      .js-hide {
        display: none !important;
      }
      #gate-form,
      #go-btn,
      #password-input {
        position: relative;
        z-index: 20;
        pointer-events: auto;
      }
    </style>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="starfield" aria-hidden="true"></div>

    <section id="gate" class="screen gate-screen" aria-label="Passwort">
      <div class="gate-frame">
        <p class="blink neon-pink">★ UNDER CONSTRUCTION ★</p>
        <h1 class="impact rainbow-text">ZUTRITT</h1>
        <p class="comic gate-sub">Geheime Website™ — nur mit Passwort</p>
        <p class="comic tip">Passwort eingeben:</p>
        <form
          id="gate-form"
          autocomplete="off"
          action="#"
          method="post"
          onsubmit="event.preventDefault(); if (window.handleGateSubmit) { window.handleGateSubmit(); } else { alert('app.js fehlt – bitte app.js mit hochladen'); } return false;"
        >
          <input
            id="password-input"
            type="password"
            name="password"
            maxlength="64"
            placeholder="********"
            required
            autofocus
          />
          <button id="go-btn" type="submit" class="btn-go">ÖFFNEN!!!</button>
        </form>
        <div id="fail-stage" class="fail-stage" aria-live="polite"></div>
        <p class="visitor comic">Besucher Nr. <span class="blink">124,621,876</span> ★ Seit 1998 online</p>
        <p id="asset-warning" class="comic" style="display: none; color: #ff0; margin-top: 0.75rem; font-size: 0.85rem">
          ⚠ app.js nicht geladen. Lade <strong>app.js</strong> in denselben Ordner wie index.html hoch.
        </p>
      </div>
    </section>

    <div id="app-root"></div>

    <!-- Password + logic live in ROOT app.js (next to index.html) -->
    <script src="app.js?v=3"></script>
    <script>
      setTimeout(function () {
        if (!window.__SITE_BOOTED) {
          var w = document.getElementById("asset-warning");
          if (w) w.style.display = "block";
        }
      }, 500);
    </script>
  </body>
</html>
